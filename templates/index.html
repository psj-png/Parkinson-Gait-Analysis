<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보행 이상 분석</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    /* 배경 그라디언트 orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: #6c3bff;
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #00d2ff;
      bottom: -100px; right: -100px;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
    }

    /* 헤더 */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108, 59, 255, 0.15);
      border: 1px solid rgba(108, 59, 255, 0.35);
      color: #a78bfa;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 14px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: #a78bfa;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.5;
    }

    /* 카드 */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* 드롭존 */
    .drop-zone {
      border: 1.5px dashed rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .drop-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(108,59,255,0.08) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: rgba(108,59,255,0.6);
    }
    .drop-zone:hover::before, .drop-zone.dragover::before {
      opacity: 1;
    }
    .drop-zone.dragover {
      background: rgba(108,59,255,0.05);
    }

    .drop-icon {
      width: 52px; height: 52px;
      background: rgba(108,59,255,0.12);
      border: 1px solid rgba(108,59,255,0.25);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 1.4rem;
      transition: transform 0.2s;
    }
    .drop-zone:hover .drop-icon {
      transform: translateY(-2px);
    }
    .drop-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .drop-hint {
      font-size: 0.75rem;
      color: #475569;
    }
    .filename-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: rgba(108,59,255,0.15);
      border: 1px solid rgba(108,59,255,0.3);
      color: #a78bfa;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      max-width: 100%;
      word-break: break-all;
    }

    input[type="file"] { display: none; }

    /* 버튼 */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6c3bff 0%, #4f86ff 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108,59,255,0.35);
    }
    .btn-primary:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(108,59,255,0.5);
    }
    .btn-primary:not(:disabled):active {
      transform: translateY(0);
    }
    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
      margin-top: 12px;
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
    }

    /* 로딩 */
    .loading {
      display: none;
      text-align: center;
      padding: 28px 0 12px;
    }
    .spinner-ring {
      width: 44px; height: 44px;
      margin: 0 auto 14px;
      position: relative;
    }
    .spinner-ring::before, .spinner-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    .spinner-ring::before {
      border: 3px solid rgba(255,255,255,0.06);
    }
    .spinner-ring::after {
      border: 3px solid transparent;
      border-top-color: #6c3bff;
      border-right-color: #4f86ff;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 0.85rem;
      color: #64748b;
    }
    .loading-text span {
      color: #a78bfa;
      font-weight: 500;
    }

    /* 결과 */
    .result {
      display: none;
      margin-top: 22px;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-hero {
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .result-hero.normal {
      background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(5,150,105,0.05) 100%);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .result-hero.abnormal {
      background: linear-gradient(135deg, rgba(239,68,68,0.1) 0%, rgba(185,28,28,0.05) 100%);
      border: 1px solid rgba(239,68,68,0.2);
    }

    .result-icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      display: block;
    }
    .result-label {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .result-hero.normal   .result-label { color: #34d399; }
    .result-hero.abnormal .result-label { color: #f87171; }
    .result-conf-text {
      font-size: 0.82rem;
      color: #64748b;
    }

    /* 신뢰도 바 */
    .conf-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .conf-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .conf-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .conf-name {
      font-size: 0.82rem;
      font-weight: 500;
      color: #94a3b8;
    }
    .conf-pct {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .bar-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      width: 0%;
    }
    .bar-normal   { background: linear-gradient(90deg, #10b981, #34d399); }
    .bar-abnormal { background: linear-gradient(90deg, #ef4444, #f87171); }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 16px 0;
    }

    .frames-note {
      text-align: center;
      font-size: 0.75rem;
      color: #475569;
    }

    /* 에러 */
    .error-box {
      display: none;
      margin-top: 14px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        AI 보행 분석
      </div>
      <h1>보행 이상 감지</h1>
      <p class="subtitle">Optical Flow + ResNet-18 기반<br>보행 패턴 실시간 분류</p>
    </div>

    <div class="card">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">🎬</div>
        <div class="drop-label">영상을 드래그하거나 탭하여 선택</div>
        <div class="drop-hint">mp4 · avi · mov · mkv</div>
        <div id="fileName"></div>
      </div>
      <input type="file" id="fileInput" accept=".mp4,.avi,.mov,.mkv">

      <button class="btn btn-primary" id="submitBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        분석 시작
      </button>

      <div class="loading" id="loading">
        <div class="spinner-ring"></div>
        <div class="loading-text">
          <span>Optical Flow</span> 추출 중…
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <div class="result" id="result">
        <div class="result-hero" id="resultHero">
          <span class="result-icon" id="resultIcon"></span>
          <div class="result-label" id="resultLabel"></div>
          <div class="result-conf-text" id="resultConf"></div>
        </div>

        <div class="conf-section">
          <div class="conf-row">
            <div class="conf-meta">
              <span class="conf-name">Normal</span>
              <span class="conf-pct" id="normalPct">—</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill bar-normal" id="normalBar"></div>
            </div>
          </div>
          <div class="conf-row">
            <div class="conf-meta">
              <span class="conf-name">Abnormal</span>
              <span class="conf-pct" id="abnormalPct">—</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill bar-abnormal" id="abnormalBar"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="frames-note" id="framesNote"></div>

        <button class="btn btn-ghost" id="resetBtn">다시 분석하기</button>
      </div>
    </div>

  </div>

  <script>
    const dropZone  = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileName  = document.getElementById("fileName");
    const submitBtn = document.getElementById("submitBtn");
    const loading   = document.getElementById("loading");
    const errorBox  = document.getElementById("errorBox");
    const resultDiv = document.getElementById("result");
    const resetBtn  = document.getElementById("resetBtn");
    let selectedFile = null;

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("dragover"); setFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

    function setFile(file) {
      if (!file) return;
      selectedFile = file;
      fileName.innerHTML = `<div class="filename-tag">📄 ${file.name}</div>`;
      submitBtn.disabled = false;
      resultDiv.style.display = "none";
      errorBox.style.display  = "none";
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      submitBtn.disabled      = true;
      loading.style.display   = "block";
      resultDiv.style.display = "none";
      errorBox.style.display  = "none";

      const form = new FormData();
      form.append("video", selectedFile);
      try {
        const res  = await fetch("/diagnose", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok || data.error) { showError(data.error || "서버 오류"); return; }
        showResult(data);
      } catch (e) {
        showError("네트워크 오류: " + e.message);
      } finally {
        loading.style.display = "none";
        submitBtn.disabled    = false;
      }
    });

    function showResult(data) {
      const isNormal  = data.prediction === "Normal";
      const conf      = data.confidence;
      const normalP   = Math.round((conf.Normal   ?? 0) * 100);
      const abnormalP = Math.round((conf.Abnormal ?? 0) * 100);

      document.getElementById("resultHero").className = "result-hero " + (isNormal ? "normal" : "abnormal");
      document.getElementById("resultIcon").textContent  = isNormal ? "✅" : "⚠️";
      document.getElementById("resultLabel").textContent = isNormal ? "정상 보행" : "이상 보행 의심";
      document.getElementById("resultConf").textContent  = `신뢰도 ${isNormal ? normalP : abnormalP}%`;

      document.getElementById("normalPct").textContent   = normalP + "%";
      document.getElementById("abnormalPct").textContent = abnormalP + "%";
      document.getElementById("framesNote").textContent  = `분석 프레임 수 · ${data.frames_analyzed}`;

      resultDiv.style.display = "block";
      requestAnimationFrame(() => {
        document.getElementById("normalBar").style.width   = normalP + "%";
        document.getElementById("abnormalBar").style.width = abnormalP + "%";
      });
    }

    function showError(msg) {
      errorBox.textContent   = "⚠ " + msg;
      errorBox.style.display = "block";
    }

    resetBtn.addEventListener("click", () => {
      selectedFile = fileInput.value = null;
      fileName.innerHTML      = "";
      submitBtn.disabled      = true;
      resultDiv.style.display = errorBox.style.display = "none";
      document.getElementById("normalBar").style.width   = "0%";
      document.getElementById("abnormalBar").style.width = "0%";
    });
  </script>
</body>
</html>
