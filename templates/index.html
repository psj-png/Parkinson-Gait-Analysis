<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보행 이상 분석</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0;
    }
    body::before { width:500px;height:500px;background:#6c3bff;top:-150px;left:-150px; }
    body::after  { width:400px;height:400px;background:#00d2ff;bottom:-100px;right:-100px; }

    .wrapper { position:relative;z-index:1;width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px; }

    /* 헤더 */
    .header { text-align:center;margin-bottom:12px; }
    .badge {
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(108,59,255,0.15);border:1px solid rgba(108,59,255,0.35);
      color:#a78bfa;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;
      text-transform:uppercase;padding:5px 12px;border-radius:99px;margin-bottom:14px;
    }
    .badge-dot { width:6px;height:6px;background:#a78bfa;border-radius:50%;animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    h1 { font-size:1.75rem;font-weight:700;color:#f1f5f9;letter-spacing:-.02em;margin-bottom:8px; }
    .subtitle { font-size:.85rem;color:#64748b;line-height:1.5; }

    /* 카드 */
    .card {
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
      border-radius:20px;padding:24px;backdrop-filter:blur(20px);
    }
    .section-title {
      font-size:.72rem;font-weight:600;letter-spacing:.08em;
      text-transform:uppercase;color:#475569;margin-bottom:14px;
    }

    /* 드롭존 */
    .drop-zone {
      border:1.5px dashed rgba(255,255,255,.12);border-radius:14px;
      padding:36px 20px;text-align:center;cursor:pointer;transition:all .25s;
      margin-bottom:16px;position:relative;overflow:hidden;
    }
    .drop-zone::before {
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(108,59,255,.08) 0%,transparent 70%);
      opacity:0;transition:opacity .25s;
    }
    .drop-zone:hover::before,.drop-zone.dragover::before{opacity:1}
    .drop-zone:hover,.drop-zone.dragover{border-color:rgba(108,59,255,.6)}
    .drop-icon {
      width:52px;height:52px;background:rgba(108,59,255,.12);border:1px solid rgba(108,59,255,.25);
      border-radius:14px;display:flex;align-items:center;justify-content:center;
      margin:0 auto 14px;font-size:1.4rem;transition:transform .2s;
    }
    .drop-zone:hover .drop-icon{transform:translateY(-2px)}
    .drop-label{font-size:.9rem;font-weight:500;color:#cbd5e1;margin-bottom:5px}
    .drop-hint{font-size:.75rem;color:#475569}
    .filename-tag {
      display:inline-flex;align-items:center;gap:6px;margin-top:12px;
      background:rgba(108,59,255,.15);border:1px solid rgba(108,59,255,.3);
      color:#a78bfa;font-size:.78rem;font-weight:500;padding:4px 10px;border-radius:8px;word-break:break-all;
    }
    input[type="file"]{display:none}

    /* 버튼 */
    .btn {
      display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;padding:14px;border:none;border-radius:12px;
      font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;
    }
    .btn-primary{background:linear-gradient(135deg,#6c3bff 0%,#4f86ff 100%);color:#fff;box-shadow:0 4px 20px rgba(108,59,255,.35)}
    .btn-primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(108,59,255,.5)}
    .btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
    .btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#94a3b8;margin-top:12px}
    .btn-ghost:hover{background:rgba(255,255,255,.08);color:#cbd5e1}

    /* 로딩 */
    .loading{display:none;text-align:center;padding:28px 0 12px}
    .spinner-ring{width:44px;height:44px;margin:0 auto 14px;position:relative}
    .spinner-ring::before,.spinner-ring::after{content:'';position:absolute;inset:0;border-radius:50%}
    .spinner-ring::before{border:3px solid rgba(255,255,255,.06)}
    .spinner-ring::after{border:3px solid transparent;border-top-color:#6c3bff;border-right-color:#4f86ff;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:.85rem;color:#64748b}
    .loading-text span{color:#a78bfa;font-weight:500}

    /* 에러 */
    .error-box{display:none;margin-top:14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 14px;font-size:.82rem;color:#f87171}

    /* 결과 카드들 */
    .result-cards{display:none;flex-direction:column;gap:16px;animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* ── 분석 뷰어 (optical flow + 그래프) ── */
    .viewer-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

    .flow-player{position:relative}
    .flow-player img{
      width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
      background:#0d0d14;display:block;
    }
    .flow-label{margin-top:8px;font-size:.72rem;color:#475569;text-align:center}
    .frame-counter{
      position:absolute;top:8px;right:8px;
      background:rgba(0,0,0,.6);color:#a78bfa;
      font-size:.68rem;font-weight:600;padding:3px 7px;border-radius:6px;
    }

    .graph-panel{display:flex;flex-direction:column;gap:6px}
    canvas{width:100%;border-radius:10px;display:block;background:rgba(255,255,255,.02)}
    .graph-x-labels{display:flex;justify-content:space-between}
    .graph-x-labels span{font-size:.68rem;color:#475569}

    /* 판정 배지 */
    .result-hero{
      border-radius:14px;padding:22px;text-align:center;
      opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;
    }
    .result-hero.visible{opacity:1;transform:translateY(0)}
    .result-hero.normal{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(5,150,105,.05));border:1px solid rgba(16,185,129,.2)}
    .result-hero.abnormal{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(185,28,28,.05));border:1px solid rgba(239,68,68,.2)}
    .result-icon{font-size:2.4rem;margin-bottom:8px;display:block}
    .result-label{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
    .result-hero.normal   .result-label{color:#34d399}
    .result-hero.abnormal .result-label{color:#f87171}
    .result-conf-text{font-size:.82rem;color:#64748b}

    /* 신뢰도 바 */
    .conf-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .conf-row:last-of-type{margin-bottom:0}
    .conf-meta{display:flex;justify-content:space-between}
    .conf-name{font-size:.82rem;font-weight:500;color:#94a3b8}
    .conf-pct{font-size:.82rem;font-weight:600;color:#cbd5e1}
    .bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1);width:0%}
    .bar-normal{background:linear-gradient(90deg,#10b981,#34d399)}
    .bar-abnormal{background:linear-gradient(90deg,#ef4444,#f87171)}

    /* GradCAM */
    .gradcam-wrap{border-radius:12px;overflow:hidden;background:#0d0d14;opacity:0;transition:opacity .8s}
    .gradcam-wrap.visible{opacity:1}
    .gradcam-wrap img{width:100%;display:block}
    .gradcam-caption{margin-top:10px;font-size:.75rem;color:#475569;line-height:1.5}

    .divider{height:1px;background:rgba(255,255,255,.06);margin:4px 0}
    .frames-note{text-align:center;font-size:.75rem;color:#475569}
  </style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="badge"><span class="badge-dot"></span>AI 보행 분석</div>
    <h1>보행 이상 감지</h1>
    <p class="subtitle">Optical Flow + ResNet-18 기반<br>보행 패턴 실시간 분류</p>
  </div>

  <!-- 업로드 카드 -->
  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">🎬</div>
      <div class="drop-label">영상을 드래그하거나 탭하여 선택</div>
      <div class="drop-hint">mp4 · avi · mov · mkv</div>
      <div id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".mp4,.avi,.mov,.mkv">
    <button class="btn btn-primary" id="submitBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      분석 시작
    </button>
    <div class="loading" id="loading">
      <div class="spinner-ring"></div>
      <div class="loading-text"><span>Optical Flow</span> 추출 중…</div>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <!-- 결과 카드들 -->
  <div class="result-cards" id="resultCards">

    <!-- 분석 뷰어: Optical Flow 플레이어 + 실시간 그래프 -->
    <div class="card">
      <div class="section-title">분석 시각화</div>
      <div class="viewer-row">
        <div class="flow-player">
          <img id="flowImg" src="" alt="Optical Flow">
          <div class="frame-counter" id="frameCounter">0 / 30</div>
          <div class="flow-label">Optical Flow</div>
        </div>
        <div class="graph-panel">
          <div class="section-title" style="margin-bottom:8px">Normal 확률</div>
          <canvas id="confChart" height="180"></canvas>
          <div class="graph-x-labels">
            <span>F1</span><span id="midLabel"></span><span id="endLabel"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 판정 결과 -->
    <div class="card">
      <div class="result-hero" id="resultHero">
        <span class="result-icon" id="resultIcon"></span>
        <div class="result-label" id="resultLabel"></div>
        <div class="result-conf-text" id="resultConf"></div>
      </div>
      <div style="height:16px"></div>
      <div class="section-title">신뢰도</div>
      <div class="conf-row">
        <div class="conf-meta"><span class="conf-name">Normal</span><span class="conf-pct" id="normalPct">—</span></div>
        <div class="bar-track"><div class="bar-fill bar-normal" id="normalBar"></div></div>
      </div>
      <div class="conf-row">
        <div class="conf-meta"><span class="conf-name">Abnormal</span><span class="conf-pct" id="abnormalPct">—</span></div>
        <div class="bar-track"><div class="bar-fill bar-abnormal" id="abnormalBar"></div></div>
      </div>
      <div class="divider" style="margin-top:16px"></div>
      <div class="frames-note" id="framesNote" style="margin-top:10px"></div>
      <button class="btn btn-ghost" id="resetBtn">다시 분석하기</button>
    </div>

    <!-- GradCAM -->
    <div class="card">
      <div class="section-title">Grad-CAM — 모델 주목 영역</div>
      <div class="gradcam-wrap" id="gradcamWrap">
        <img id="gradcamImg" src="" alt="GradCAM">
      </div>
      <div class="gradcam-caption">붉은 영역일수록 모델이 판단에 크게 활용한 부위.</div>
    </div>

  </div>
</div>

<script>
  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const fileName    = document.getElementById('fileName');
  const submitBtn   = document.getElementById('submitBtn');
  const loading     = document.getElementById('loading');
  const errorBox    = document.getElementById('errorBox');
  const resultCards = document.getElementById('resultCards');
  const resetBtn    = document.getElementById('resetBtn');
  let selectedFile  = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    fileName.innerHTML = `<div class="filename-tag">📄 ${file.name}</div>`;
    submitBtn.disabled = false;
    resultCards.style.display = 'none';
    errorBox.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    loading.style.display = 'block';
    resultCards.style.display = 'none';
    errorBox.style.display = 'none';

    const form = new FormData();
    form.append('video', selectedFile);
    try {
      const res  = await fetch('/diagnose', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok || data.error) { showError(data.error || '서버 오류'); return; }
      playResult(data);
    } catch (e) {
      showError('네트워크 오류: ' + e.message);
    } finally {
      loading.style.display = 'none';
      submitBtn.disabled = false;
    }
  });

  // ── 분석 애니메이션 ───────────────────────────────────────────────────────────
  function playResult(data) {
    const frames   = data.flow_frames_b64 || [];
    const probs    = data.frame_normal_probs || [];
    const isNormal = data.prediction === 'Normal';
    const conf     = data.confidence;
    const normalP  = Math.round((conf.Normal   ?? 0) * 100);
    const abnormalP= Math.round((conf.Abnormal ?? 0) * 100);
    const total    = frames.length;

    // 레이블 세팅
    document.getElementById('midLabel').textContent = `F${Math.round(total/2)}`;
    document.getElementById('endLabel').textContent = `F${total}`;
    document.getElementById('framesNote').textContent = `분석 프레임 수 · ${data.frames_analyzed}`;

    // GradCAM 준비 (숨김)
    document.getElementById('gradcamImg').src = 'data:image/jpeg;base64,' + data.gradcam_b64;
    document.getElementById('gradcamWrap').classList.remove('visible');

    // 결과 배지 준비 (숨김)
    const hero = document.getElementById('resultHero');
    hero.className = 'result-hero ' + (isNormal ? 'normal' : 'abnormal');
    hero.classList.remove('visible');
    document.getElementById('resultIcon').textContent  = isNormal ? '✅' : '⚠️';
    document.getElementById('resultLabel').textContent = isNormal ? '정상 보행' : '이상 보행 의심';
    document.getElementById('resultConf').textContent  = `신뢰도 ${isNormal ? normalP : abnormalP}%`;
    document.getElementById('normalPct').textContent   = normalP + '%';
    document.getElementById('abnormalPct').textContent = abnormalP + '%';
    document.getElementById('normalBar').style.width   = '0%';
    document.getElementById('abnormalBar').style.width = '0%';

    // 결과 카드 표시
    resultCards.style.display = 'flex';

    // 캔버스 초기화
    initCanvas(probs.length, isNormal);

    // 프레임 재생 (8fps)
    const FPS      = 8;
    const interval = 1000 / FPS;
    let   fi       = 0;

    const timer = setInterval(() => {
      if (fi >= total) {
        clearInterval(timer);
        // 재생 끝 → 결과 + GradCAM 표시
        setTimeout(() => {
          hero.classList.add('visible');
          requestAnimationFrame(() => {
            document.getElementById('normalBar').style.width   = normalP + '%';
            document.getElementById('abnormalBar').style.width = abnormalP + '%';
          });
        }, 200);
        setTimeout(() => {
          document.getElementById('gradcamWrap').classList.add('visible');
        }, 600);
        return;
      }

      // Optical Flow 프레임 표시
      if (frames[fi]) {
        document.getElementById('flowImg').src = 'data:image/jpeg;base64,' + frames[fi];
      }
      document.getElementById('frameCounter').textContent = `${fi + 1} / ${total}`;

      // 그래프 누적 그리기
      drawChartUpTo(fi + 1, probs, isNormal);

      fi++;
    }, interval);
  }

  // ── Canvas 그래프 ─────────────────────────────────────────────────────────────
  let _canvasW = 0, _canvasH = 0, _dpr = 1;
  const pad = { top: 12, right: 8, bottom: 8, left: 30 };

  function initCanvas(total, isNormal) {
    const canvas = document.getElementById('confChart');
    _dpr = window.devicePixelRatio || 1;
    _canvasW = canvas.offsetWidth || 220;
    _canvasH = 180;
    canvas.width  = _canvasW * _dpr;
    canvas.height = _canvasH * _dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(_dpr, _dpr);

    // 배경
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.roundRect(0, 0, _canvasW, _canvasH, 8);
    ctx.fill();

    // 0.5 기준선
    const midY = pad.top + (_canvasH - pad.top - pad.bottom) * 0.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, midY); ctx.lineTo(_canvasW - pad.right, midY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Y 레이블
    ctx.fillStyle = '#475569';
    ctx.font = '9px Inter, sans-serif';
    ctx.textAlign = 'right';
    [['1.0', 0], ['0.5', 0.5], ['0.0', 1.0]].forEach(([label, r]) => {
      ctx.fillText(label, pad.left - 4, pad.top + (_canvasH - pad.top - pad.bottom) * r + 4);
    });
  }

  function drawChartUpTo(n, probs, isNormal) {
    const canvas = document.getElementById('confChart');
    const ctx    = canvas.getContext('2d');
    const W = _canvasW, H = _canvasH;
    const cW = W - pad.left - pad.right;
    const cH = H - pad.top  - pad.bottom;
    const total = probs.length;

    const toX = i => pad.left + (i / (total - 1)) * cW;
    const toY = v => pad.top  + (1 - v) * cH;

    // 지우기 (그래프 영역만)
    ctx.clearRect(pad.left, pad.top - 2, cW + pad.right, cH + 10);

    // 배경 재그리기
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.roundRect(0, 0, W, H, 8);
    ctx.fill();
    const midY = pad.top + cH * 0.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, midY); ctx.lineTo(W - pad.right, midY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#475569'; ctx.font = '9px Inter, sans-serif'; ctx.textAlign = 'right';
    [['1.0', 0], ['0.5', 0.5], ['0.0', 1.0]].forEach(([label, r]) => {
      ctx.fillText(label, pad.left - 4, pad.top + cH * r + 4);
    });

    if (n < 2) return;
    const slice = probs.slice(0, n);

    // 그라디언트 채우기
    const grad = ctx.createLinearGradient(0, pad.top, 0, H);
    if (isNormal) {
      grad.addColorStop(0, 'rgba(16,185,129,0.3)'); grad.addColorStop(1, 'rgba(16,185,129,0)');
    } else {
      grad.addColorStop(0, 'rgba(239,68,68,0.3)');  grad.addColorStop(1, 'rgba(239,68,68,0)');
    }
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(slice[0]));
    slice.forEach((v, i) => { if (i > 0) ctx.lineTo(toX(i), toY(v)); });
    ctx.lineTo(toX(slice.length - 1), H - pad.bottom);
    ctx.lineTo(toX(0), H - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 선
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(slice[0]));
    slice.forEach((v, i) => { if (i > 0) ctx.lineTo(toX(i), toY(v)); });
    ctx.strokeStyle = isNormal ? '#34d399' : '#f87171';
    ctx.lineWidth   = 2;
    ctx.lineJoin    = 'round';
    ctx.stroke();

    // 점
    slice.forEach((v, i) => {
      ctx.beginPath();
      ctx.arc(toX(i), toY(v), i === slice.length - 1 ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isNormal ? '#34d399' : '#f87171';
      ctx.fill();
    });
  }

  function showError(msg) {
    errorBox.textContent   = '⚠ ' + msg;
    errorBox.style.display = 'block';
  }

  resetBtn.addEventListener('click', () => {
    selectedFile = fileInput.value = null;
    fileName.innerHTML = '';
    submitBtn.disabled = true;
    resultCards.style.display = errorBox.style.display = 'none';
  });
</script>
</body>
</html>
