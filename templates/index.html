<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보행 이상 분석</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #718096;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* 드래그앤드롭 영역 */
    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }
    .drop-zone.dragover {
      border-color: #4299e1;
      background: #ebf8ff;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .drop-zone p { color: #718096; font-size: 0.9rem; }
    .drop-zone .filename {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #2d3748;
      font-weight: 600;
      word-break: break-all;
    }

    input[type="file"] { display: none; }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3182ce; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #2b6cb0; }

    /* 로딩 */
    .loading {
      display: none;
      text-align: center;
      padding: 24px 0 8px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #718096; font-size: 0.875rem; }

    /* 결과 */
    .result { display: none; margin-top: 24px; }

    .result-badge {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .result-badge.normal   { background: #f0fff4; }
    .result-badge.abnormal { background: #fff5f5; }

    .result-badge .label {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .result-badge.normal   .label { color: #276749; }
    .result-badge.abnormal .label { color: #9b2c2c; }

    .result-badge .emoji { font-size: 2.2rem; margin-bottom: 8px; }
    .result-badge .conf-main { font-size: 0.9rem; color: #4a5568; }

    /* 신뢰도 바 */
    .conf-bars { display: flex; flex-direction: column; gap: 12px; }
    .conf-item label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #4a5568;
      margin-bottom: 4px;
    }
    .bar-bg {
      background: #e2e8f0;
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }
    .bar-normal   { background: #48bb78; }
    .bar-abnormal { background: #fc8181; }

    .frames-note {
      margin-top: 16px;
      text-align: center;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .btn-reset {
      margin-top: 16px;
      background: #edf2f7;
      color: #4a5568;
    }

    /* 에러 */
    .error-box {
      display: none;
      margin-top: 16px;
      background: #fff5f5;
      border: 1px solid #fc8181;
      border-radius: 10px;
      padding: 14px 16px;
      color: #9b2c2c;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <h1>보행 이상 분석</h1>
  <p class="subtitle">Optical Flow + ResNet-18 기반 보행 패턴 분류</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="icon">🎬</div>
      <p>영상 파일을 여기에 드래그하거나<br>탭해서 선택하세요</p>
      <p style="margin-top:6px; font-size:0.78rem; color:#a0aec0;">mp4 · avi · mov · mkv</p>
      <div class="filename" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".mp4,.avi,.mov,.mkv">

    <button class="btn btn-primary" id="submitBtn" disabled>분석 시작</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Optical Flow 추출 중…</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result" id="result">
      <div class="result-badge" id="resultBadge">
        <div class="emoji" id="resultEmoji"></div>
        <div class="label" id="resultLabel"></div>
        <div class="conf-main" id="resultConf"></div>
      </div>

      <div class="conf-bars">
        <div class="conf-item">
          <label><span>Normal</span><span id="normalPct"></span></label>
          <div class="bar-bg"><div class="bar-fill bar-normal" id="normalBar" style="width:0%"></div></div>
        </div>
        <div class="conf-item">
          <label><span>Abnormal</span><span id="abnormalPct"></span></label>
          <div class="bar-bg"><div class="bar-fill bar-abnormal" id="abnormalBar" style="width:0%"></div></div>
        </div>
      </div>

      <div class="frames-note" id="framesNote"></div>

      <button class="btn btn-reset" id="resetBtn">다시 분석하기</button>
    </div>
  </div>

  <script>
    const dropZone   = document.getElementById("dropZone");
    const fileInput  = document.getElementById("fileInput");
    const fileName   = document.getElementById("fileName");
    const submitBtn  = document.getElementById("submitBtn");
    const loading    = document.getElementById("loading");
    const errorBox   = document.getElementById("errorBox");
    const resultDiv  = document.getElementById("result");
    const resetBtn   = document.getElementById("resetBtn");

    let selectedFile = null;

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

    function setFile(file) {
      if (!file) return;
      selectedFile = file;
      fileName.textContent = file.name;
      submitBtn.disabled = false;
      resultDiv.style.display = "none";
      errorBox.style.display = "none";
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      loading.style.display = "block";
      resultDiv.style.display = "none";
      errorBox.style.display = "none";

      const form = new FormData();
      form.append("video", selectedFile);

      try {
        const res = await fetch("/diagnose", { method: "POST", body: form });
        const data = await res.json();

        if (!res.ok || data.error) {
          showError(data.error || "서버 오류가 발생했습니다.");
          return;
        }
        showResult(data);
      } catch (e) {
        showError("네트워크 오류: " + e.message);
      } finally {
        loading.style.display = "none";
        submitBtn.disabled = false;
      }
    });

    function showResult(data) {
      const badge    = document.getElementById("resultBadge");
      const isNormal = data.prediction === "Normal";
      const conf     = data.confidence;
      const normalP  = Math.round((conf.Normal   ?? 0) * 100);
      const abnormalP= Math.round((conf.Abnormal ?? 0) * 100);

      badge.className = "result-badge " + (isNormal ? "normal" : "abnormal");
      document.getElementById("resultEmoji").textContent = isNormal ? "✅" : "⚠️";
      document.getElementById("resultLabel").textContent = isNormal ? "정상 보행" : "이상 보행 의심";
      document.getElementById("resultConf").textContent  =
        `신뢰도 ${isNormal ? normalP : abnormalP}%`;

      document.getElementById("normalPct").textContent   = normalP + "%";
      document.getElementById("abnormalPct").textContent = abnormalP + "%";
      document.getElementById("normalBar").style.width   = normalP + "%";
      document.getElementById("abnormalBar").style.width = abnormalP + "%";
      document.getElementById("framesNote").textContent  =
        `분석 프레임 수: ${data.frames_analyzed}`;

      resultDiv.style.display = "block";
    }

    function showError(msg) {
      errorBox.textContent  = "오류: " + msg;
      errorBox.style.display = "block";
    }

    resetBtn.addEventListener("click", () => {
      selectedFile = null;
      fileInput.value = "";
      fileName.textContent = "";
      submitBtn.disabled = true;
      resultDiv.style.display = "none";
      errorBox.style.display  = "none";
    });
  </script>

</body>
</html>
